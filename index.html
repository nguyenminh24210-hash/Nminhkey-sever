<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>NMINHIOS KEY ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}h1{font-size:24px;margin:4px 0 6px}.sub{color:#8f96a3;font-size:13px;margin-bottom:18px}.card{background:#11141a;border:1px solid #242936;border-radius:16px;padding:16px;margin-bottom:14px}label{display:block;color:#aeb5c2;font-size:13px;margin:12px 0 6px}input,select,button{width:100%;border-radius:10px;border:1px solid #303644;background:#0b0e13;color:#fff;padding:12px;font-size:15px}input:focus,select:focus{outline:none;border-color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{cursor:pointer;font-weight:700;background:#fff;color:#08090d;border:0;margin-top:10px}button.secondary{background:#202631;color:#fff}button.danger{background:#c93636;color:#fff}button.green{background:#3aa76d;color:#fff}button.orange{background:#c98532;color:#fff}.status{white-space:pre-wrap;word-break:break-word;background:#090b0f;border:1px solid #252a34;border-radius:10px;padding:12px;font-size:12px;min-height:44px}.keyrow{display:flex;gap:8px;align-items:center;border-top:1px solid #242936;padding:10px 0}.keyrow:first-child{border-top:0}.key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all;flex:1}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#252a34;color:#ddd}.copy{width:auto;margin:0;padding:8px 10px;background:#252a34;color:#fff}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>🔐 NMINHIOS KEY ADMIN</h1><div class="sub">Quản lý mã • Cloudflare Worker + Firebase</div>
<div class="card"><label>Địa chỉ máy chủ</label><input id="api" value="https://nminhios-key.nguyenquangminh24122010.workers.dev">
<label>Mã quản trị</label><input id="secret" type="password" placeholder="Nhập mã quản trị">
<div class="grid"><div><label>Thời hạn sử dụng</label><input id="duration" type="number" min="0" value="30"></div><div><label>Đơn vị thời gian</label><select id="unit"><option value="days">Ngày</option><option value="hours">Giờ</option><option value="weeks">Tuần</option><option value="months">Tháng</option><option value="permanent">Vĩnh viễn</option></select></div></div>
<label>Số lượng mã</label><input id="count" type="number" min="1" max="100" value="1">
<label>HWID (không bắt buộc)</label><input id="hwid" placeholder="Để trống nếu muốn gắn HWID lần đầu sử dụng"><button onclick="createKeys()">TẠO MÃ</button></div>
<div class="card"><label>Mã cần thao tác</label><input id="actionKey" placeholder="KEY-XXXXXXXX">
<div class="grid"><button class="danger" onclick="action('disable')">KHÓA MÃ</button><button class="green" onclick="action('enable')">MỞ KHÓA MÃ</button><button class="orange" onclick="action('extend')">GIA HẠN MÃ</button><button class="secondary" onclick="action('reset-hwid')">ĐẶT LẠI HWID</button></div>
<label>Thời gian gia hạn</label><div class="grid"><input id="extendDuration" type="number" min="1" value="30"><select id="extendUnit"><option value="days">Ngày</option><option value="hours">Giờ</option><option value="weeks">Tuần</option><option value="months">Tháng</option></select></div></div>
<div class="card"><button class="secondary" onclick="getKeys()">🔄 TẢI LẠI DANH SÁCH</button><label>Kết quả</label><div id="status" class="status">Chưa thực hiện thao tác nào.</div><div id="keys"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
function base(){return $('api').value.trim().replace(/\/+$/,'')}
function auth(){return {'Content-Type':'application/json','Authorization':'Bearer '+$('secret').value.trim()}}
function show(x){$('status').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function post(path,body){try{const r=await fetch(base()+path,{method:'POST',headers:auth(),body:JSON.stringify(body)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={http_status:r.status,raw:t}}show(d);return d}catch(e){show({error:'LỖI KẾT NỐI',message:e.message})}}
async function createKeys(){let u=$('unit').value,d=u==='permanent'?0:Number($('duration').value)||0,c=Math.max(1,Math.min(100,Number($('count').value)||1));let b={duration:d,count:c,unit:u};let h=$('hwid').value.trim();if(h)b.hwid=h;let dta=await post('/admin/create',b);render(dta&&(dta.keys||dta.created)||[])}
async function action(type){let k=$('actionKey').value.trim();if(!k){show('Vui lòng nhập mã.');return}let b={key:k};if(type==='extend'){b.duration=Number($('extendDuration').value)||1;b.unit=$('extendUnit').value}await post('/admin/'+type,b);await getKeys()}
async function getKeys(){try{const r=await fetch(base()+'/admin/get',{headers:{'Authorization':'Bearer '+$('secret').value.trim()}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={http_status:r.status,raw:t}}show(d);render(d&&(d.keys||d)||[])}catch(e){show({error:'LỖI KẾT NỐI',message:e.message})}}
function render(list){$('keys').innerHTML='';if(!Array.isArray(list))return;list.forEach(x=>{let k=typeof x==='string'?x:x.key;if(!k)return;let row=document.createElement('div');row.className='keyrow';let a=document.createElement('div');a.className='key';a.textContent=k;let b=document.createElement('span');b.className='badge';b.textContent=x.disabled?'KHÓA MÃD':'ĐANG HOẠT ĐỘNG';let c=document.createElement('button');c.className='copy';c.textContent='SAO CHÉP';c.onclick=()=>navigator.clipboard.writeText(k);row.append(a,b,c);$('keys').appendChild(row)})}
</script></body></html>
